name: Build
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    steps:
      - uses: actions/checkout@v4
      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libode-dev libyaml-cpp-dev
      - name: "Build"
        run: make
      - name: "Test"
        run: make test

  build-macos:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14 ]
    steps:
      - uses: actions/checkout@v4
      - name: "Install dependencies"
        run: |
          brew tap robotology/formulae || true
          brew install cmake pkg-config robotology/formulae/ode yaml-cpp || \
            brew install cmake pkg-config ode yaml-cpp
      - name: "Build"
        run: make
      - name: "Test"
        run: make test
